<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مواقع تواصل ريما 🦋</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            direction: rtl;
            min-height: 100vh;
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background:
                linear-gradient(135deg, rgba(42, 31, 61, 0.55), rgba(107, 77, 128, 0.45)),
                url('background.png') center/cover no-repeat,
                linear-gradient(135deg, #2a1f3d, #6b4d80);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 40px;
            /* ترك مساحة علوية للعنوان ومساحة سفلية للتمرير المريح */
            overflow-x: hidden;
            /* منع التمرير الأفقي المزعج */
            overflow-y: auto;
            /* تفعيل التمرير العمودي فقط إذا كان المحتوى أكبر من الشاشة */
            position: relative;
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.9;
            }

            90% {
                opacity: 0.9;
            }

            100% {
                transform: translateY(-10vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        .title {
            position: absolute;
            top: 20px;
            left: 10px;
            right: 10px;
            text-align: center;
            font-size: clamp(22px, 5vw, 40px);
            /* تصغير حجم الخط قليلاً على الشاشات الصغيرة جداً */
            font-weight: 800;
            color: #f6d68a;
            text-shadow: 0 2px 18px rgba(255, 200, 120, 0.7);
            z-index: 3;
            margin: 0;
        }

        .stage {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: popIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.6) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* الأجنحة - تحسين الأبعاد لتناسب الهواتف ولا تخرج عن الشاشة */
        .wings {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: min(600px, 180vw);
            /* تقليص الحجم الأقصى ليتناسب مع الهواتف دون تمدد زائد */
            display: flex;
            direction: ltr;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
            z-index: 1;
        }

        .wing {
            width: 50%;
            max-width: 300px;
            /* ضبط الحجم الأقصى لكل جناح */
            mix-blend-mode: screen;
            filter: brightness(1.3) contrast(1.3);
            -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 52%, #000 35%, transparent 68%);
            mask-image: radial-gradient(ellipse 60% 70% at 50% 52%, #000 35%, transparent 68%);
            transform-origin: bottom center;
        }

        .wingRight {
            margin-left: -12%;
            animation: flapR 2.4s ease-in-out infinite;
        }

        .wingLeft {
            margin-right: -12%;
            transform: scaleX(-1);
            animation: flapL 2.4s ease-in-out infinite;
        }

        @keyframes flapR {

            0%,
            100% {
                transform: rotate(4deg) translateY(0) scaleY(1);
            }

            50% {
                transform: rotate(-12deg) translateY(-10px) scaleY(0.93);
            }
        }

        @keyframes flapL {

            0%,
            100% {
                transform: scaleX(-1) rotate(4deg) translateY(0) scaleY(1);
            }

            50% {
                transform: scaleX(-1) rotate(-12deg) translateY(-10px) scaleY(0.93);
            }
        }

        /* البطاقة */
        .card {
            position: relative;
            z-index: 2;
            width: min(320px, 90vw);
            /* تكبير العرض قليلاً على الهواتف للاستفادة من المساحة */
            margin-top: 50px;
            padding: 30px 20px 24px;
            border-radius: 22px;
            text-align: center;
            background: radial-gradient(circle at 50% 0%, #fffdf8 0%, #fff4e6 55%, #ffe9d6 100%);
            box-shadow: 0 26px 70px rgba(60, 30, 70, 0.5), 0 0 0 1px rgba(232, 184, 92, 0.5),
                inset 0 0 0 2px rgba(232, 184, 92, 0.35), inset 0 0 30px rgba(255, 214, 160, 0.25);
        }

        .card::before,
        .card::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border: 2px solid rgba(199, 145, 63, 0.55);
            border-radius: 4px;
        }

        .card::before {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
        }

        .card::after {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
        }

        .seal {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            animation: beat 1.6s ease-in-out infinite;
        }

        .ct {
            color: #9a3d5e;
            font-size: clamp(15px, 4vw, 18px);
            font-weight: 800;
            margin: 4px 0 2px;
        }

        .hr {
            font-size: clamp(16px, 4vw, 22px);
            margin: 2px 0;
            animation: beat 1.4s ease-in-out infinite;
        }

        @keyframes beat {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.1);
            }
        }

        .cn {
            color: #b87a2a;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 800;
            margin: 0 0 16px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(199, 145, 63, 0.4);
            color: #5a3a40;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
            -webkit-tap-highlight-color: transparent;
            /* تحسين تجربة الضغط على الهواتف */
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            background: #fff;
            box-shadow: 0 10px 24px rgba(150, 47, 191, 0.25);
        }

        .mute {
            position: absolute;
            bottom: -15px;
            right: -15px;
            z-index: 4;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <h2 class="title">م مواقع تواصل ريما 🦋💗</h2>

    <div class="stage">
        <div class="wrap">
            <div class="wings">
                <!-- تم تصحيح الامتداد هنا إلى wing.jpg ليتوافق مع اسم الملف لديك -->
                <img class="wing wingLeft" src="wing.jpg" alt="" aria-hidden="true" />
                <img class="wing wingRight" src="wing.jpg" alt="" aria-hidden="true" />
            </div>

            <div class="card">
                <div class="seal" aria-hidden="true">🦋</div>
                <p class="ct">تابعني على الانستاقرام 💗</p>
                <div class="hr" aria-hidden="true">🤍🌸🤍</div>
                <p class="cn">ريما 🌸</p>
                <div class="links">
                    <a class="btn" href="https://www.instagram.com/rema_dokhi" target="_blank"
                        rel="noopener noreferrer">
                        <svg viewBox="0 0 24 24" width="28" height="28">
                            <defs>
                                <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#feda75" />
                                    <stop offset="25%" stop-color="#fa7e1e" />
                                    <stop offset="50%" stop-color="#d62976" />
                                    <stop offset="75%" stop-color="#962fbf" />
                                    <stop offset="100%" stop-color="#4f5bd5" />
                                </linearGradient>
                            </defs>
                            <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)" />
                            <circle cx="12" cy="12" r="4.2" fill="none" stroke="#fff" stroke-width="1.8" />
                            <circle cx="17.2" cy="6.8" r="1.3" fill="#fff" />
                        </svg>
                        <span>إنستغرام</span>
                    </a>
                    <a class="btn" href="https://www.snapchat.com/t/TofHTsry" target="_blank" rel="noopener noreferrer">
                        <svg viewBox="0 0 24 24" width="28" height="28">
                            <rect x="2" y="2" width="20" height="20" rx="6" fill="#FFFC00" />
                            <path
                                d="M12 5.2c1.9 0 3.1 1.4 3.1 3.4 0 .5 0 1 .1 1.4.3.2.7.2 1 .1.5-.1.8.5.4.8-.3.2-.8.4-1.1.6-.2.4.6 1.6 1.9 2 .4.1.3.6 0 .8-.4.2-1 .2-1.3.5-.1.3.1.7-.3.8-.4.1-1-.3-1.7-.1-.5.2-.9.9-2 .9s-1.5-.7-2-.9c-.7-.2-1.3.2-1.7.1-.4-.1-.2-.5-.3-.8-.3-.3-.9-.3-1.3-.5-.3-.2-.4-.7 0-.8 1.3-.4 2.1-1.6 1.9-2-.3-.2-.8-.4-1.1-.6-.4-.3-.1-.9.4-.8.3.1.7.1 1-.1.1-.4.1-.9.1-1.4 0-2 1.2-3.4 3.1-3.4z"
                                fill="#fff" stroke="#000" stroke-width="0.4" />
                        </svg>
                        <span>سناب شات</span>
                    </a>
                </div>
                <button class="mute" id="muteBtn" title="كتم / تشغيل">🔊</button>
            </div>
        </div>
    </div>

    <audio id="song" src="song.mp3" loop preload="auto"></audio>

    <script>
        // الفراشات والورود
        const EMOJIS = ['🦋', '🌸', '✨', '💗', '🌷', '💖', '🦋', '🌸'];
        const c = document.getElementById('particles');
        for (let i = 0; i < 14; i++) { // تقليل العدد قليلاً لتحسين الأداء على الهواتف
            const s = document.createElement('span'); s.className = 'particle';
            s.textContent = EMOJIS[i % EMOJIS.length];
            s.style.left = Math.random() * 100 + '%';
            s.style.fontSize = (14 + Math.random() * 16) + 'px';
            s.style.animationDuration = (8 + Math.random() * 8) + 's';
            s.style.animationDelay = (Math.random() * 6) + 's';
            c.appendChild(s);
        }
        // الموسيقى
        const song = document.getElementById('song');
        song.volume = 0.85;
        document.addEventListener('click', () => { song.play().catch(() => { }); }, { once: true });
        const muteBtn = document.getElementById('muteBtn');
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            song.muted = !song.muted;
            muteBtn.textContent = song.muted ? '🔇' : '🔊';
        });
    </script>
</body>

</html>
