<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موقع تواصل ريما 🦋</title>
    <style>
        /* استدعاء خط Cairo المميز للعربية و Playfair Display الفخم للإنجليزية */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:ital,wght@1,600;1,800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            direction: rtl;
            min-height: 100vh;
            margin: 0;
            font-family: 'Cairo', sans-serif; /* الخط العربي الافتراضي للموقع */
            background:
                linear-gradient(135deg, rgba(42, 31, 61, 0.55), rgba(107, 77, 128, 0.45)),
                url('background.png') center/cover no-repeat,
                linear-gradient(135deg, #2a1f3d, #6b4d80);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* شاشة الترحيب */
        .welcome-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #2a1f3d, #4a2c5e);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }

        .welcome-box {
            text-align: center;
            padding: 40px 30px;
            width: min(340px, 85vw);
            animation: fadeInScale 1s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            position: relative;
        }

        /* تنسيق اسم Rema بخط إنجليزي ساحر وعريض ومائل */
        .welcome-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 800;
            font-size: 68px;
            color: #f6d68a;
            margin: 0 0 10px 0;
            text-shadow: 0 0 25px rgba(246, 214, 138, 0.5);
            letter-spacing: 3px;
        }

        .welcome-sub {
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 35px 0;
            letter-spacing: 0.5px;
        }

        .enter-site-btn {
            background: transparent;
            color: #f6d68a;
            border: 2px solid #f6d68a;
            padding: 12px 42px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(246, 214, 138, 0.1);
        }

        .enter-site-btn:hover {
            background: #f6d68a;
            color: #2a1f3d;
            box-shadow: 0 0 25px rgba(246, 214, 138, 0.4);
            transform: translateY(-2px);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% {
                transform: translateY(-10vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        /* عنوان الصفحة العلوي بخط عريض ومميز */
        .title {
            position: absolute;
            top: 26px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 900;
            color: #f6d68a;
            text-shadow: 0 2px 18px rgba(255, 200, 120, 0.7);
            z-index: 3;
            margin: 0;
        }

        .stage {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.6) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* الأجنحة المفصولة */
        .wings {
            position: absolute;
            top: -6%;
            left: 50%;
            transform: translateX(-50%);
            width: min(1000px, 165vw);
            display: flex;
            direction: ltr;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
            z-index: 1;
        }

        .wing {
            width: 50%;
            max-width: 520px;
            filter: brightness(1.1) contrast(1.1);
        }

        .wingRight {
            margin-left: -8%;
            transform-origin: bottom left;
            animation: flapR 2.4s ease-in-out infinite;
        }

        .wingLeft {
            margin-right: -8%;
            transform-origin: bottom right;
            animation: flapL 2.4s ease-in-out infinite;
        }

        @keyframes flapR {
            0%, 100% { transform: rotate(4deg) translateY(0) scaleY(1); }
            50% { transform: rotate(-12deg) translateY(-16px) scaleY(0.93); }
        }

        @keyframes flapL {
            0%, 100% { transform: rotate(-4deg) translateY(0) scaleY(1); }
            50% { transform: rotate(12deg) translateY(-16px) scaleY(0.93); }
        }

        /* البطاقة */
        .card {
            position: relative;
            z-index: 2;
            width: min(300px, 82vw);
            margin-top: 40px;
            padding: 26px 22px 24px;
            border-radius: 22px;
            text-align: center;
            background: radial-gradient(circle at 50% 0%, #fffdf8 0%, #fff4e6 55%, #ffe9d6 100%);
            box-shadow: 0 26px 70px rgba(60, 30, 70, 0.5), 0 0 0 1px rgba(232, 184, 92, 0.5),
                inset 0 0 0 2px rgba(232, 184, 92, 0.35), inset 0 0 30px rgba(255, 214, 160, 0.25);
        }

        .card::before,
        .card::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border: 2px solid rgba(199, 145, 63, 0.55);
            border-radius: 4px;
        }

        .card::before { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .card::after { bottom: 10px; left: 10px; border-right: none; border-top: none; }

        .seal {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            animation: beat 1.6s ease-in-out infinite;
        }

        .ct {
            color: #9a3d5e;
            font-size: clamp(15px, 4vw, 18px);
            font-weight: 700;
            margin: 4px 0 2px;
        }

        .hr {
            font-size: clamp(18px, 4vw, 24px);
            margin: 2px 0;
            animation: beat 1.4s ease-in-out infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .cn {
            color: #b87a2a;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 900;
            margin: 0 0 16px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(199, 145, 63, 0.4);
            color: #5a3a40;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            background: #fff;
            box-shadow: 0 10px 24px rgba(150, 47, 191, 0.25);
        }

        .mute {
            position: absolute;
            bottom: -8px;
            right: -8px;
            z-index: 4;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>
    <!-- شاشة الترحيب -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-box">
            <div class="welcome-name">Rema</div>
            <div class="welcome-sub">مرحباً بك في عالمي 🦋</div>
            <button class="enter-site-btn" id="enterBtn">دخول الموقع</button>
        </div>
    </div>

    <div class="particles" id="particles" aria-hidden="true"></div>
    <h2 class="title">مواقع تواصل ريما 🦋💗</h2>

    <div class="stage">
        <div class="wrap">
            <div class="wings">
                <img class="wing wingLeft" src="wingleft.png" alt="" aria-hidden="true" />
                <img class="wing wingRight" src="wingright.png" alt="" aria-hidden="true" />
            </div>

            <div class="card">
                <div class="seal" aria-hidden="true">🦋</div>
                <p class="ct">تابعني على الانستاقرام 💗</p>
                <div class="hr" aria-hidden="true">🤍🌸🤍</div>
                <p class="cn">ريما 🌸</p>
                <div class="links">
                    <a class="btn" href="https://www.instagram.com/rema_dokhi" target="_blank" rel="noopener noreferrer">
                        <svg viewBox="0 0 24 24" width="32" height="32">
                            <defs>
                                <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#feda75" />
                                    <stop offset="25%" stop-color="#fa7e1e" />
                                    <stop offset="50%" stop-color="#d62976" />
                                    <stop offset="75%" stop-color="#962fbf" />
                                    <stop offset="100%" stop-color="#4f5bd5" />
                                </linearGradient>
                            </defs>
                            <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)" />
                            <circle cx="12" cy="12" r="4.2" fill="none" stroke="#fff" stroke-width="1.8" />
                            <circle cx="17.2" cy="6.8" r="1.3" fill="#fff" />
                        </svg>
                        <span>إنستغرام</span>
                    </a>
                    <a class="btn" href="https://www.snapchat.com/t/TofHTsry" target="_blank" rel="noopener noreferrer">
                        <svg viewBox="0 0 24 24" width="32" height="32">
                            <rect x="2" y="2" width="20" height="20" rx="6" fill="#FFFC00" />
                            <path d="M12 5.2c1.9 0 3.1 1.4 3.1 3.4 0 .5 0 1 .1 1.4.3.2.7.2 1 .1.5-.1.8.5.4.8-.3.2-.8.4-1.1.6-.2.4.6 1.6 1.9 2 .4.1.3.6 0 .8-.4.2-1 .2-1.3.5-.1.3.1.7-.3.8-.4.1-1-.3-1.7-.1-.5.2-.9.9-2 .9s-1.5-.7-2-.9c-.7-.2-1.3.2-1.7.1-.4-.1-.2-.5-.3-.8-.3-.3-.9-.3-1.3-.5-.3-.2-.4-.7 0-.8 1.3-.4 2.1-1.6 1.9-2-.3-.2-.8-.4-1.1-.6-.4-.3-.1-.9.4-.8.3.1.7.1 1-.1.1-.4.1-.9.1-1.4 0-2 1.2-3.4 3.1-3.4z" fill="#fff" stroke="#000" stroke-width="0.4" />
                        </svg>
                        <span>سناب شات</span>
                    </a>
                </div>
                <button class="mute" id="muteBtn" title="كتم / تشغيل">🔊</button>
            </div>
        </div>
    </div>

    <audio id="song" src="song.mp3" loop preload="auto"></audio>

    <script>
        // الفراشات والورود الخلفية
        const EMOJIS = ['🦋', '🌸', '✨', '💗', '🌷', '💖', '🦋', '🌸'];
        const c = document.getElementById('particles');
        for (let i = 0; i < 18; i++) {
            const s = document.createElement('span'); s.className = 'particle';
            s.textContent = EMOJIS[i % EMOJIS.length];
            s.style.left = Math.random() * 100 + '%';
            s.style.fontSize = (16 + Math.random() * 20) + 'px';
            s.style.animationDuration = (9 + Math.random() * 10) + 's';
            s.style.animationDelay = (Math.random() * 10) + 's';
            c.appendChild(s);
        }

        const song = document.getElementById('song');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const enterBtn = document.getElementById('enterBtn');
        const muteBtn = document.getElementById('muteBtn');
        
        song.volume = 0.85;

        // عند الضغط على زر دخول الموقع
        enterBtn.addEventListener('click', () => {
            song.play().catch((err) => { console.log("خطأ بالتشغيل:", err); });
            
            welcomeOverlay.style.opacity = '0';
            setTimeout(() => {
                welcomeOverlay.style.display = 'none';
            }, 600);
        });

        // زر كتم / تشغيل الصوت
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            song.muted = !song.muted;
            muteBtn.textContent = song.muted ? '🔇' : '🔊';
        });
    </script>
</body>

</html>
